name: Setup Node
description: Installs Node with npm caching. Must run after actions/checkout — a local composite action cannot itself perform the checkout, since the runner needs the repo present to resolve this action in the first place.
inputs:
    cache-dependency-path:
        description: Path to the package-lock.json to key the npm cache on
        required: true
runs:
    using: composite
    steps:
        - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
          with:
              node-version: "24"
              cache: "npm"
              cache-dependency-path: ${{ inputs.cache-dependency-path }}
