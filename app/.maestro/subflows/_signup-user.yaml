appId: com.ethos.app
---
# Requires TEST_EMAIL in the calling flow's env (no TEST_PASSWORD — see below).
- extendedWaitUntil:
      visible: 'WELCOME BACK.'
      timeout: 10000
- tapOn:
      id: 'signup-link'
- extendedWaitUntil:
      visible: 'CREATE ACCOUNT'
      timeout: 8000
- tapOn:
      id: 'email-input'
- inputText: ${TEST_EMAIL}
# autoComplete="new-password" triggers iOS's "Use Strong Password?" sheet on
# tap. It's outside the accessibility tree and eats input while shown, so we
# can't dismiss and type past it — instead we accept its suggestion, since no
# test depends on the actual password value. hideKeyboard first: tapping this
# field while another is focused otherwise silently no-ops.
- hideKeyboard
- tapOn:
      id: 'password-input'
# Coordinate tap: the sheet's button isn't in the accessibility tree
# (1206x2622 iPhone 17 simulator).
- tapOn:
      point: '50%, 84%'
- tapOn:
      id: 'submit-button'
- tapOn:
      text: 'Not Now'
      optional: true
- extendedWaitUntil:
      visible: 'ETHOS'
      timeout: 8000
