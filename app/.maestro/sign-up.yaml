appId: com.ethos.app
---
- runScript: gen-test-email.js
- launchApp:
      clearState: true
      # See login.yaml for why clearKeychain is needed too.
      clearKeychain: true
- runFlow:
      file: subflows/_signup-user.yaml
      env:
          TEST_EMAIL: ${output.TEST_EMAIL}

# Error path: same email again → email already exists error
- tapOn:
      id: 'sign-out-button'
- extendedWaitUntil:
      visible: 'WELCOME BACK.'
      timeout: 10000
- tapOn:
      id: 'signup-link'
- extendedWaitUntil:
      visible: 'CREATE ACCOUNT'
      timeout: 10000
- tapOn:
      id: 'email-input'
- inputText: ${output.TEST_EMAIL}
# See subflows/_signup-user.yaml for why this uses the OS's autofill sheet.
- hideKeyboard
- tapOn:
      id: 'password-input'
- tapOn:
      point: '50%, 84%'
- tapOn:
      id: 'submit-button'
- extendedWaitUntil:
      visible: 'AN ACCOUNT WITH THIS EMAIL ALREADY EXISTS'
      timeout: 10000
