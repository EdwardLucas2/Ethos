all:
  hosts:
    runner:
      # Update ansible_host with the IP from: cd infra/tofu/runner && tofu output runner_public_ip
      ansible_host: "REPLACE_WITH_TOFU_OUTPUT"
      ansible_user: ubuntu
      # Matches the key generated in README Step 3 (ssh-keygen ... -f ~/.ssh/ethos-runner).
      # Every documented playbook invocation also passes --private-key ~/.ssh/ethos-runner
      # explicitly, but this default keeps a bare `ansible-playbook` run working too.
      ansible_ssh_private_key_file: "~/.ssh/ethos-runner"
